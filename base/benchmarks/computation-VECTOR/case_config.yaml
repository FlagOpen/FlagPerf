# Vector 算力测试通用配置

# 向量大小 (元素数量)
# 256M elements = 256 * 1024 * 1024 = 268,435,456 elements
# FP32: 268M * 4 bytes = 1 GB
VECTOR_SIZE: 268435456

# 预热次数
WARMUP: 50

# 测试迭代次数
ITERS: 10000

# 分布式后端
DIST_BACKEND: "mpi"

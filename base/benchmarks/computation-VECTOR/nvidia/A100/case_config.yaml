# NVIDIA A100 特定配置
# A100 有更大的显存，可以使用更大的向量

# 向量大小: 512M elements (2 GB for FP32)
VECTOR_SIZE: 536870912

# 分布式后端使用 NCCL (NVIDIA 优化)
DIST_BACKEND: "nccl"
